<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>QRacter</title>
    <meta name="description" content="Лист персонажа D&amp;D: заклинания, черты, способности, ресурсы и характеристики. Работает офлайн, персонаж передаётся по QR-коду." />
    <meta name="theme-color" content="#1f2933" />
    <base href="/DndSpells.github.io/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/popups.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorSpellsPicker.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <!-- iOS ignores the manifest for the home screen: the icon, the label and standalone
         mode all come from these four tags instead. The touch icon is opaque because iOS
         composites transparency onto black, and full-bleed because iOS applies its own
         squircle mask. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="QRacter" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/popup-interop.js"></script>
    <script src="js/pwa-interop.js"></script>
    <script>
        // Pin the culture instead of letting the runtime infer it. dotnet.js picks the ICU
        // shard from `applicationCulture || navigator.languages[0]`, so without this an
        // English-locale browser loads icudt_EFIGS while a Russian one loads icudt_no_CJK —
        // and the service worker has to precache all three to cover every visitor. Pinning
        // makes the choice deterministic, which is what lets service-worker.published.js
        // exclude the other two shards (~566 KB less transferred, 1.4 MB less cached).
        // The app is Russian-only, and the numeric filter keys that must not be localised
        // already format with CultureInfo.InvariantCulture explicitly.
        // Started after the interop scripts so their globals exist before .NET code runs.
        //
        // The service worker is registered only once the runtime has loaded (see
        // register() in pwa-interop.js). Registering at parse time makes the worker's
        // precache and the runtime's own downloads race for the same files on an empty
        // cache, so both miss and ~3.3 MB is fetched twice; ordering them turns the
        // second pass into 304s. Nothing is precached less eagerly as a result — the
        // same 74 files are cached, using bytes already paid for.
        //
        // .finally, not .then: if Blazor.start() ever rejects, the worker must still
        // register or the app is never available offline at all.
        //
        // Promise.race caps the wait. On a fast connection with a slow phone the runtime
        // is CPU-bound compiling wasm, and without the cap the network would sit idle
        // that whole time; 2.5 s is past the bulk downloads on any usable connection.
        Promise.race([
            Blazor.start({ applicationCulture: 'ru-RU' }),
            new Promise(resolve => setTimeout(resolve, 2500)),
        ]).finally(() => window.pwaInterop.register());
    </script>
</body>

</html>
