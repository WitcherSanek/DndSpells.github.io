<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>QRacter</title>
    <meta name="description" content="Лист персонажа D&amp;D: заклинания, черты, способности, ресурсы и характеристики. Работает офлайн, персонаж передаётся по QR-коду." />
    <meta name="theme-color" content="#1f2933" />
    <base href="/DndSpells.github.io/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/popups.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorSpellsPicker.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <!-- iOS ignores the manifest for the home screen: the icon, the label and standalone
         mode all come from these four tags instead. The touch icon is opaque because iOS
         composites transparency onto black, and full-bleed because iOS applies its own
         squircle mask. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="QRacter" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/popup-interop.js"></script>
    <script src="js/pwa-interop.js"></script>
</body>

</html>
